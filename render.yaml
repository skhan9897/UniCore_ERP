# Render Infrastructure Blueprint for UniCore ERP Enterprise
services:
  # Single Unified Web Service (Backend API + React Frontend)
  - type: web
    name: unicore-erp-unified
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /v3/api-docs
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: unicore-mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: unicore-mysql
          property: port
      - key: DB_NAME
        fromDatabase:
          name: unicore-mysql
          property: database
      - key: DB_USER
        fromDatabase:
          name: unicore-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: unicore-mysql
          property: password

databases:
  # MySQL Database Instance
  - name: unicore-mysql
    databaseName: university_erp
    user: unicore_admin
    region: singapore
    plan: starter
